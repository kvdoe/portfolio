<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask about Karan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0c0906;
      --surface:  rgba(201,169,110,0.05);
      --border:   rgba(201,169,110,0.12);
      --electric: #c9a96e;
      --violet:   #c47b5c;
      --amber:    #d4a853;
      --amber2:   #e8c98a;
      --pale:     #9a8878;
      --white:    #f4ede4;
      --font-h:   'Space Grotesk', sans-serif;
      --font-b:   'Inter', sans-serif;
      --font-m:   'Space Mono', monospace;
      --ease:     cubic-bezier(0.16,1,0.3,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-b);
      font-size: 16px;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    /* orbs */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); z-index: 0; pointer-events: none; opacity: 0.25;
    }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, var(--violet) 0%, transparent 70%); top: -100px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, var(--electric) 0%, transparent 70%); bottom: -100px; right: -100px; }

    /* layout */
    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
    }

    /* header */
    .page-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--pale);
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--white); }
    .back-btn svg { width: 16px; height: 16px; }
    .header-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--amber), var(--violet));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-h); font-size: 16px; font-weight: 700; color: #000;
      flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-name { font-family: var(--font-h); font-size: 16px; font-weight: 600; }
    .header-sub { font-size: 12px; color: var(--pale); }

    /* suggested chips */
    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 16px 0 0;
      flex-shrink: 0;
    }
    .suggestion-chip {
      font-family: var(--font-b); font-size: 12px;
      padding: 7px 14px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--pale); cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .suggestion-chip:hover {
      border-color: var(--electric); color: var(--white);
      background: rgba(201,169,110,0.1);
    }

    /* messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg { display: flex; gap: 12px; max-width: 100%; }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-h); font-size: 11px; font-weight: 700;
      align-self: flex-end;
    }
    .msg.bot .msg-avatar {
      background: linear-gradient(135deg, var(--amber), var(--violet)); color: #000;
    }
    .msg.user .msg-avatar {
      background: rgba(201,169,110,0.15); border: 1px solid var(--border); color: var(--pale);
    }

    .msg-bubble {
      max-width: calc(100% - 56px);
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px; line-height: 1.7;
    }
    .msg.bot .msg-bubble {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--white); border-bottom-left-radius: 4px;
    }
    .msg.user .msg-bubble {
      background: linear-gradient(135deg, var(--amber), var(--violet));
      color: #000; font-weight: 500; border-bottom-right-radius: 4px;
    }

    /* typing */
    .typing-bubble {
      display: flex; gap: 4px; align-items: center; padding: 14px 16px;
    }
    .typing-bubble span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--pale); display: inline-block;
      animation: dot 1.2s ease-in-out infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* input */
    .input-area {
      flex-shrink: 0;
      padding: 14px 0 20px;
      border-top: 1px solid var(--border);
    }
    .input-row {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.2s;
    }
    .input-row:focus-within { border-color: rgba(201,169,110,0.4); }
    #page-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--white); font-family: var(--font-b); font-size: 14px;
      line-height: 1.5; resize: none; max-height: 120px;
    }
    #page-input::placeholder { color: var(--pale); }
    #page-send {
      width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px;
      background: var(--amber); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    #page-send:hover { background: var(--amber2); transform: scale(1.05); }
    #page-send svg { width: 16px; height: 16px; color: #000; }

    @media (max-width: 600px) {
      .page { padding: 0 12px; }
      .suggestions { gap: 6px; }
      .suggestion-chip { font-size: 11px; padding: 6px 12px; }
    }
  </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="page">
  <div class="page-header">
    <a class="back-btn" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </a>
    <div class="header-avatar">K</div>
    <div class="header-info">
      <div class="header-name">Ask about Karan</div>
      <div class="header-sub">AI · knows everything about him</div>
    </div>
  </div>

  <div class="suggestions">
    <button class="suggestion-chip" data-q="What has Karan built?">What has he built?</button>
    <button class="suggestion-chip" data-q="What awards has Karan won?">Awards</button>
    <button class="suggestion-chip" data-q="Tell me about GradeWay">GradeWay</button>
    <button class="suggestion-chip" data-q="Tell me about Naturista">Naturista</button>
    <button class="suggestion-chip" data-q="What is Karan's background?">Background</button>
    <button class="suggestion-chip" data-q="How can I contact Karan?">Contact</button>
  </div>

  <div id="messages">
    <div class="msg bot">
      <div class="msg-avatar">K</div>
      <div class="msg-bubble">Hey! I'm an AI that knows everything about Karan, his ventures, awards, background, and more. What would you like to know?</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="page-input" placeholder="Ask anything about Karan…" rows="1" maxlength="500"></textarea>
      <button id="page-send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  const messages = document.getElementById('messages');
  const input = document.getElementById('page-input');
  const sendBtn = document.getElementById('page-send');
  const chatHistory = [];

  function appendMsg(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'bot' ? 'K' : 'You';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typing';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = 'K';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble typing-bubble';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
    return wrap;
  }

  async function send(text) {
    text = text.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    appendMsg('user', text);
    chatHistory.push({ role: 'user', content: text });
    const typing = showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chatHistory })
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      const reply = data.reply || 'Sorry, something went wrong.';
      typing.remove();
      appendMsg('bot', reply);
      chatHistory.push({ role: 'assistant', content: reply });
    } catch {
      typing.remove();
      appendMsg('bot', 'Sorry, I ran into an error. Try again in a moment.');
    }
  }

  sendBtn.addEventListener('click', () => send(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  document.querySelectorAll('.suggestion-chip').forEach(chip => {
    chip.addEventListener('click', () => send(chip.dataset.q));
  });
</script>
</body>
</html>
