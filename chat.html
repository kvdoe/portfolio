<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doe — Ask about Karan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #050302;
      --amber:   #d4a853;
      --amber2:  #e8c98a;
      --amber3:  #c9880a;
      --pale:    #9a8878;
      --white:   #f4ede4;
      --border:  rgba(201,169,110,0.14);
      --surface: rgba(201,169,110,0.06);
      --font-h:  'Space Grotesk', sans-serif;
      --font-b:  'Inter', sans-serif;
      --font-m:  'Space Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-b);
      overflow: hidden;
    }

    /* ── Background orbs matching main site ── */
    .orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; opacity: 0.28; }
    .orb-1 { width: 550px; height: 550px; background: radial-gradient(circle, #c47b5c 0%, transparent 70%); top: -160px; left: -160px; animation: o1 14s ease-in-out infinite; }
    .orb-2 { width: 450px; height: 450px; background: radial-gradient(circle, #c9a96e 0%, transparent 70%); bottom: -120px; right: -120px; animation: o2 18s ease-in-out infinite; }
    .orb-3 { width: 350px; height: 350px; background: radial-gradient(circle, #d4a853 0%, transparent 70%); top: 40%; left: 35%; animation: o3 22s ease-in-out infinite; opacity: 0.14; }
    @keyframes o1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(50px,40px)} }
    @keyframes o2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-60px,30px)} }
    @keyframes o3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-50px)} }

    /* ── Page layout ── */
    .scene {
      position: relative; z-index: 1;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px;
      gap: 0;
    }

    /* ── Back link ── */
    .back {
      position: fixed; top: 18px; left: 22px; z-index: 10;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--pale);
      text-decoration: none; letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    .back:hover { color: var(--white); }
    .back svg { width: 15px; height: 15px; }

    /* ── MacBook laptop shell ── */
    .laptop {
      width: min(820px, 92vw);
      display: flex; flex-direction: column; align-items: center;
      filter: drop-shadow(0 40px 80px rgba(0,0,0,0.85));
    }

    /* ── Lid / screen ── */
    .lid {
      width: 100%;
      background: #1c1c1e;
      border-radius: 14px 14px 4px 4px;
      padding: 12px 12px 6px;
      position: relative;
      border: 1.5px solid #333;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 2px 0 #111;
    }

    /* camera notch */
    .lid::before {
      content: '';
      position: absolute;
      top: 5px; left: 50%; transform: translateX(-50%);
      width: 10px; height: 10px;
      background: #111;
      border-radius: 50%;
      box-shadow: 0 0 0 1.5px #2a2a2a;
      z-index: 2;
    }

    /* screen glass */
    .screen-glass {
      width: 100%;
      aspect-ratio: 1.6 / 1;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid #111;
    }

    /* subtle screen glare */
    .screen-glass::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 35%;
      background: linear-gradient(180deg, rgba(255,255,255,0.025) 0%, transparent 100%);
      pointer-events: none; z-index: 20;
      border-radius: 6px 6px 0 0;
    }

    /* ── Screen interior ── */
    .screen-inner {
      width: 100%; height: 100%;
      background: #07040200;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* mac menu bar */
    .mac-bar {
      flex-shrink: 0;
      height: 26px;
      background: rgba(12,8,4,0.96);
      backdrop-filter: blur(10px);
      display: flex; align-items: center;
      padding: 0 12px;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: relative; z-index: 5;
    }
    .traffic { display: flex; gap: 5px; align-items: center; }
    .tl {
      width: 10px; height: 10px; border-radius: 50%;
      cursor: default;
    }
    .tl.r { background: #ff5f57; box-shadow: 0 0 4px rgba(255,95,87,0.5); }
    .tl.y { background: #febc2e; box-shadow: 0 0 4px rgba(254,188,46,0.4); }
    .tl.g { background: #28c840; box-shadow: 0 0 4px rgba(40,200,64,0.4); }
    .mac-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-family: var(--font-h);
      font-size: 11px; font-weight: 600;
      color: rgba(244,237,228,0.7);
      letter-spacing: 0.06em;
    }
    .mac-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
      animation: dotPulse 2s ease-in-out infinite;
      margin-left: auto;
    }
    @keyframes dotPulse { 0%,100%{opacity:0.6} 50%{opacity:1} }

    /* screen background — warm dark matching site */
    .screen-bg {
      flex: 1;
      background: radial-gradient(ellipse 80% 70% at 30% 40%, rgba(196,123,92,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 60% at 75% 70%, rgba(201,136,10,0.09) 0%, transparent 55%),
                  #07040200;
      background-color: #06030100;
      display: flex; flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* suggestion chips row */
    .chips {
      flex-shrink: 0;
      display: flex; flex-wrap: wrap; gap: 5px;
      padding: 10px 14px 6px;
    }
    .chip {
      font-size: 10px; font-family: var(--font-b);
      padding: 4px 10px; border-radius: 20px;
      background: rgba(201,169,110,0.08);
      border: 1px solid rgba(201,169,110,0.18);
      color: var(--pale); cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      white-space: nowrap;
    }
    .chip:hover { border-color: var(--amber); color: var(--white); background: rgba(201,169,110,0.14); }

    /* messages */
    #msgs {
      flex: 1; overflow-y: auto;
      padding: 10px 14px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    #msgs::-webkit-scrollbar { width: 3px; }
    #msgs::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.2); border-radius: 2px; }

    .m { display: flex; gap: 8px; }
    .m.user { flex-direction: row-reverse; }
    .m-av {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; font-family: var(--font-h);
      align-self: flex-end;
    }
    .m.bot .m-av  { background: linear-gradient(135deg, var(--amber), #c47b5c); color: #000; }
    .m.user .m-av { background: rgba(201,169,110,0.12); border: 1px solid var(--border); color: var(--pale); }
    .m-bub {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 11.5px; line-height: 1.65;
    }
    .m.bot  .m-bub { background: rgba(201,169,110,0.07); border: 1px solid var(--border); color: var(--white); border-bottom-left-radius: 3px; }
    .m.user .m-bub { background: linear-gradient(135deg, var(--amber), #c47b5c); color: #000; font-weight: 500; border-bottom-right-radius: 3px; }

    /* typing indicator */
    .typing { display: flex; gap: 3px; align-items: center; padding: 9px 12px; }
    .typing span {
      width: 5px; height: 5px; border-radius: 50%; background: var(--pale);
      animation: td 1.2s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes td { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }

    /* input bar */
    .input-bar {
      flex-shrink: 0;
      padding: 8px 12px 10px;
      border-top: 1px solid rgba(201,169,110,0.1);
      display: flex; gap: 7px; align-items: flex-end;
      background: rgba(5,3,2,0.6);
    }
    #si {
      flex: 1; background: rgba(201,169,110,0.06);
      border: 1px solid rgba(201,169,110,0.18);
      border-radius: 9px; color: var(--white);
      font-family: var(--font-b); font-size: 11px;
      padding: 7px 11px; resize: none; outline: none;
      line-height: 1.5; max-height: 80px;
      transition: border-color 0.2s;
    }
    #si::placeholder { color: rgba(154,136,120,0.6); }
    #si:focus { border-color: rgba(212,168,83,0.45); }
    #sb {
      width: 30px; height: 30px; flex-shrink: 0;
      border-radius: 8px; background: var(--amber);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    #sb:hover { background: var(--amber2); transform: scale(1.08); }
    #sb svg { width: 13px; height: 13px; color: #000; }

    /* ── Hinge ── */
    .hinge {
      width: 96%; height: 5px;
      background: linear-gradient(180deg, #111 0%, #1e1e1e 100%);
      border-radius: 0 0 2px 2px;
    }

    /* ── Base / keyboard ── */
    .base {
      width: 104%;
      background: linear-gradient(180deg, #1e1e20 0%, #232325 100%);
      border-radius: 0 0 12px 12px;
      padding: 10px 18px 14px;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      border: 1.5px solid #2e2e30;
      border-top: none;
    }

    /* keyboard rows */
    .kb { display: flex; flex-direction: column; gap: 3px; width: 100%; }
    .kr { display: flex; gap: 3px; justify-content: center; }
    .k {
      height: 20px;
      background: linear-gradient(180deg, #2e2e32 0%, #26262a 100%);
      border-radius: 3px;
      border: 1px solid #3a3a3e;
      box-shadow: 0 1px 0 #111;
      flex: 1; max-width: 28px;
    }
    .k.wide  { max-width: 44px; flex: 1.6; }
    .k.wider { max-width: 64px; flex: 2.4; }
    .k.space { max-width: 220px; flex: 8; }

    /* trackpad */
    .tp {
      width: 38%; height: 14px;
      background: linear-gradient(180deg, #272729 0%, #1f1f21 100%);
      border-radius: 4px;
      border: 1px solid #333;
    }

    /* notch bottom (where lid meets base) */
    .base-notch {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 80px; height: 3px;
      background: #111;
      border-radius: 3px 3px 0 0;
    }

    /* responsive */
    @media (max-width: 600px) {
      .base { padding: 7px 12px 10px; }
      .k { height: 15px; }
      .tp { height: 10px; }
    }
  </style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<a class="back" href="/">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  Back
</a>

<div class="scene">
  <div class="laptop">
    <!-- Lid -->
    <div class="lid">
      <div class="screen-glass">
        <div class="screen-inner">

          <!-- Mac menu bar -->
          <div class="mac-bar">
            <div class="traffic">
              <div class="tl r"></div>
              <div class="tl y"></div>
              <div class="tl g"></div>
            </div>
            <span class="mac-title">Doe — Ask about Karan</span>
            <div class="mac-dot"></div>
          </div>

          <!-- Screen content -->
          <div class="screen-bg">
            <!-- Suggestion chips -->
            <div class="chips">
              <button class="chip" data-q="What has Karan built?">What has he built?</button>
              <button class="chip" data-q="What awards has Karan won?">Awards</button>
              <button class="chip" data-q="Tell me about GradeWay">GradeWay</button>
              <button class="chip" data-q="Tell me about Naturista">Naturista</button>
              <button class="chip" data-q="How can I contact Karan?">Contact</button>
            </div>

            <!-- Messages -->
            <div id="msgs">
              <div class="m bot">
                <div class="m-av">D</div>
                <div class="m-bub">Hey! I'm Doe, Karan's personal AI. Ask me anything about him — ventures, awards, background, whatever you're curious about.</div>
              </div>
            </div>

            <!-- Input -->
            <div class="input-bar">
              <textarea id="si" placeholder="Ask Doe anything…" rows="1" maxlength="500"></textarea>
              <button id="sb">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Hinge -->
    <div class="hinge"></div>

    <!-- Base / keyboard -->
    <div class="base" style="position:relative;">
      <div class="kb">
        <!-- function row (thin) -->
        <div class="kr">
          <div class="k wide" style="height:13px"></div>
          <div class="k" style="height:13px"></div><div class="k" style="height:13px"></div><div class="k" style="height:13px"></div><div class="k" style="height:13px"></div>
          <div class="k" style="height:13px"></div><div class="k" style="height:13px"></div><div class="k" style="height:13px"></div><div class="k" style="height:13px"></div>
          <div class="k" style="height:13px"></div><div class="k" style="height:13px"></div><div class="k" style="height:13px"></div><div class="k" style="height:13px"></div>
          <div class="k wide" style="height:13px"></div>
        </div>
        <!-- row 1 -->
        <div class="kr">
          <div class="k wide"></div>
          <div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div>
          <div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div>
          <div class="k"></div><div class="k"></div><div class="k wider"></div>
        </div>
        <!-- row 2 -->
        <div class="kr">
          <div class="k wider"></div>
          <div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div>
          <div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div>
          <div class="k"></div><div class="k wider"></div>
        </div>
        <!-- row 3 -->
        <div class="kr">
          <div class="k wide" style="max-width:52px;flex:2"></div>
          <div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div>
          <div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div>
          <div class="k wide" style="max-width:52px;flex:2"></div>
        </div>
        <!-- spacebar row -->
        <div class="kr">
          <div class="k wide"></div><div class="k"></div><div class="k"></div>
          <div class="k space"></div>
          <div class="k"></div><div class="k"></div><div class="k wide"></div>
        </div>
      </div>
      <div class="tp"></div>
      <div class="base-notch"></div>
    </div>
  </div>
</div>

<script>
  const msgs    = document.getElementById('msgs');
  const input   = document.getElementById('si');
  const sendBtn = document.getElementById('sb');
  const history = [];

  function appendMsg(role, text) {
    const w = document.createElement('div');
    w.className = 'm ' + role;
    const av = document.createElement('div');
    av.className = 'm-av';
    av.textContent = role === 'bot' ? 'D' : 'You';
    const b = document.createElement('div');
    b.className = 'm-bub';
    b.textContent = text;
    w.appendChild(av); w.appendChild(b);
    msgs.appendChild(w);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const w = document.createElement('div');
    w.className = 'm bot'; w.id = 'typing';
    const av = document.createElement('div');
    av.className = 'm-av'; av.textContent = 'D';
    const b = document.createElement('div');
    b.className = 'm-bub typing';
    b.innerHTML = '<span></span><span></span><span></span>';
    w.appendChild(av); w.appendChild(b);
    msgs.appendChild(w);
    msgs.scrollTop = msgs.scrollHeight;
    return w;
  }

  async function send(text) {
    text = text.trim();
    if (!text) return;
    input.value = ''; input.style.height = 'auto';
    appendMsg('user', text);
    history.push({ role: 'user', content: text });
    const t = showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      const reply = data.reply || 'Something went wrong.';
      t.remove();
      appendMsg('bot', reply);
      history.push({ role: 'assistant', content: reply });
    } catch {
      t.remove();
      appendMsg('bot', 'Sorry, ran into an error. Try again in a moment.');
    }
  }

  sendBtn.addEventListener('click', () => send(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 80) + 'px';
  });
  document.querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => send(c.dataset.q))
  );
</script>
</body>
</html>
